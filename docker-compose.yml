services:
  backend:
    build:
      context: backend
      target: runtime
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    env_file:
      - backend/.env
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aipos_dev
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d aipos_dev"]
      interval: 5s
      retries: 10

volumes:
  pg_data:
