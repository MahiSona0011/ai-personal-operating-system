name: Deploy Backend

# Triggers only after CI completes successfully on main.
# Required GitHub secrets:
#   RAILWAY_DEPLOY_HOOK — from Railway dashboard → Service → Settings → Deploy → Deploy Hook
#   GITHUB_TOKEN        — provided automatically by Actions (for GHCR push)

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    name: Build image & deploy to Railway
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Railway deploy
        run: curl --fail -sX POST "${{ secrets.RAILWAY_DEPLOY_HOOK }}"
