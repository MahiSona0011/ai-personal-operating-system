name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff pytest pytest-asyncio httpx

      - name: Lint
        run: ruff check .

      - name: Test
        # Exit code 5 = no tests collected; treat as pass until tests are added.
        run: |
          pytest tests/ -v --tb=short; CODE=$?
          [ $CODE -eq 5 ] && exit 0 || exit $CODE
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci_db
          ANTHROPIC_API_KEY: ""
          ENVIRONMENT: test

  frontend:
    name: Frontend — lint, type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://placeholder.railway.app/api/v1
          NEXT_TELEMETRY_DISABLED: 1
