name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Test (SQLite suite + Postgres-marked tests, 80% coverage floor)
        # A failing or empty test run must fail the build. No exit-code escape hatches.
        run: pytest -v --tb=short --cov=app/api --cov=app/services --cov-report=term-missing --cov-fail-under=80
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci_db

  frontend:
    name: Frontend — lint, type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://placeholder.railway.app/api/v1
          NEXT_TELEMETRY_DISABLED: 1

  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      E2E_BASE_URL: http://localhost:3000
      E2E_API_URL: http://localhost:8000/api/v1

    steps:
      - uses: actions/checkout@v4

      # Backend + Postgres in containers. No real credentials: AI calls can't leave the box and
      # email goes to the mail sink the tests start (see docker-compose.e2e.yml).
      - name: Start backend and database
        working-directory: .
        run: docker compose -f docker-compose.e2e.yml up --build --detach --wait

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      # playwright.config.ts starts `next start` itself and the mail sink in global setup.
      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/e2e/.report
            frontend/e2e/.results
          retention-days: 7

      - name: Backend logs
        if: failure()
        working-directory: .
        run: docker compose -f docker-compose.e2e.yml logs --no-color backend

      - name: Stop backend and database
        if: always()
        working-directory: .
        run: docker compose -f docker-compose.e2e.yml down -v

  # One required check for branch protection: it passes only when every job above passed.
  # (Settings > Branches > require status check "CI OK".)
  ci-ok:
    name: CI OK
    if: always()
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs must have succeeded
        run: |
          echo "backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }} e2e=${{ needs.e2e.result }}"
          test "${{ needs.backend.result }}" = success && test "${{ needs.frontend.result }}" = success && test "${{ needs.e2e.result }}" = success
